# Règles de validation — NexaMart
# Utilisé par le pipeline de vérification

rules:
  - name: fact_sales_not_empty
    table: fact_sales
    check: row_count > 0
    session: S02

  - name: dim_keys_unique
    tables: [dim_date, dim_product, dim_store, dim_customer, dim_channel]
    check: primary_key_unique
    session: S02

  - name: fact_sales_no_null_fk
    table: fact_sales
    check: no_null_foreign_keys
    columns: [date_key, product_key, store_key, customer_key, channel_key]
    session: S02

  - name: bridge_weights_sum_to_one
    table: bridge_customer_segment
    check: sum_by_group_equals
    group_by: customer_key
    column: weight
    expected: 1.0
    tolerance: 0.001
    session: S08

  - name: dataset_identity
    file: data/metadata/dataset_identity.json
    check: signature_matches_seed
    session: S01
